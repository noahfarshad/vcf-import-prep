esx:
  build: "12345678"
  user: root
sites:
  site-a:
    vcenter:
      fqdn: vc8a.example.com
      ip: 10.0.0.60
      prefix: 24
      gateway: 10.0.0.254
      dns: [10.0.0.10]
      sso_domain: vsphere.local
      size: small
      vc_user: administrator@vsphere.local
      vc_password:                           # vc8a.example.com. Blank: asked for
      root_password:                         # root on the vc8a.example.com appliance. Blank: asked for
      target:
        host: esxmgmt01.example.com
        datastore: ds1
        network: pg-mgmt
    datacenter: dc01
    cluster:
      name: cluster01
      ha: true
      drs: true
    network:
      vds: vds01
      mtu: 9000
      uplinks: 2
      pnics: [vmnic0, vmnic1]
      portgroups:
        management:
          name: vds01-pg-mgmt
          vlan: 110
        vmotion:
          name: vds01-pg-vmotion
          vlan: 141
        vsan:
          name: vds01-pg-vsan
          vlan: 142
      vmotion:
        prefix: 24
        range: 10.0.141.61-99
        # gateway: 10.0.141.254              # only for routed vMotion. Left out, the
                                             # adapter gets none, which a single-subnet
                                             # cluster wants. A host whose adapter has a
                                             # different gateway is reported, never changed
      vsan:
        prefix: 24
        range: 10.0.142.61-99
        # gateway: 10.0.142.254              # same, for routed vSAN
    esx_password:                            # root on the hosts below. Blank: asked for
    hosts:
      - esx01.example.com
      - esx02.example.com
    # source: the vCenter these hosts come OUT of, when they are being moved rather
    # than built new. host_release.py reads it; deploy_vc.py ignores it. One env file
    # then describes both ends of the move.
    # source:
    #   vcenter: oldvc.example.com           # the vCenter these hosts are in today
    #   user: administrator@vsphere.local
    #   password:                            # blank: asked for by name, never stored
    #   cluster: old-cluster-01              # optional: refuse a host found anywhere else
    #   nsx: oldnsx.example.com              # only if these hosts are NSX-prepared
    #   nsx_user: admin
    #   nsx_password:
    #   min_free_pct: 25                     # refuse an evacuation leaving vSAN tighter
    #   hosts:                               # exactly the hosts to release. No wildcards
    #     - esx01.example.com
    #     - esx02.example.com
  site-b:
    vcenter:
      fqdn: vc8b.example.com
    datacenter: dc02
    cluster:
      name: cluster02
    hosts:
      - esx11.example.com
